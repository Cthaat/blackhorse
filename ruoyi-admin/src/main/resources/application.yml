# 项目相关配置
ruoyi:
  # 名称
  name: 实验室安全与设备管理系统
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 系统临时上传与导出路径
  profile: ${LAB_PROFILE_ROOT:${user.home}/.blackhorse/profile}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    # Business SQL parameters may contain private task inputs and message snapshots.
    com.ruoyi.lab.mapper: info
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # Flyway数据库迁移
  flyway:
    enabled: true
    url: ${LAB_DB_URL}
    user: ${LAB_DB_USERNAME}
    password: ${LAB_DB_PASSWORD}
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
    placeholder-replacement: false
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: ${LAB_REDIS_HOST:localhost}
      # 端口，默认为6379
      port: ${LAB_REDIS_PORT:6379}
      # 数据库索引
      database: 0
      # 密码
      password: ${LAB_REDIS_PASSWORD:}
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: ${LAB_TOKEN_SECRET:${random.uuid}${random.uuid}}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Knife4j UI 由 starter 的静态资源提供；4.5.0 的可选增强器与 Springdoc 2.9.0
# 二进制不兼容，因此保持关闭。/doc.html 与 JWT Try-it-out 仍在非生产环境可用。
knife4j:
  enable: false

# 实验室受控附件只写入本机私有目录，不通过静态资源直接暴露
lab:
  storage:
    local-root: ${LAB_FILE_ROOT:${user.home}/.blackhorse/lab-files}
    max-file-size: 10MB
    max-files-per-object: 5
  jobs:
    batch-size: ${LAB_JOBS_BATCH_SIZE:200}

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: ''
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/lab/*
