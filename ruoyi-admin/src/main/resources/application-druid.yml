# 数据源配置
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源
            master:
                url: ${LAB_DB_URL}
                username: ${LAB_DB_USERNAME}
                password: ${LAB_DB_PASSWORD}
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: ${LAB_DB_SLAVE_ENABLED:false}
                url: ${LAB_DB_SLAVE_URL:}
                username: ${LAB_DB_SLAVE_USERNAME:}
                password: ${LAB_DB_SLAVE_PASSWORD:}
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter: 
                enabled: false
            statViewServlet:
                enabled: false
                url-pattern: /druid/*
            filter:
                stat:
                    enabled: false
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true

---
spring:
    config:
        activate:
            on-profile: druid-stat
    datasource:
        druid:
            webStatFilter:
                enabled: true
            statViewServlet:
                enabled: true
                # 监控仅在显式 profile 下启用，账号和密码没有默认值
                allow: ${LAB_DRUID_STAT_ALLOW:127.0.0.1}
                url-pattern: /druid/*
                login-username: ${LAB_DRUID_STAT_USERNAME}
                login-password: ${LAB_DRUID_STAT_PASSWORD}
            filter:
                stat:
                    enabled: true
